<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Ares architecture: an orchestrator routes over A2A HTTP to coder, thinker, runner and Serena agents, all on local Ollama models with mem0 memory and Langfuse tracing">
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#38BDF8"/>
    </marker>
  </defs>
  <rect width="800" height="400" rx="16" fill="#0B1220"/>
  <rect x="1" y="1" width="798" height="398" rx="16" fill="none" stroke="#1E293B" stroke-width="2"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="40" y="74" font-size="44" font-weight="700" fill="#F8FAFC">ares</text>
    <text x="40" y="112" font-size="22" fill="#94A3B8">ollama · mem0 · langfuse</text>
    <rect x="602" y="40" width="158" height="42" rx="21" fill="#0F2A1F" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="630" cy="61" r="6" fill="#34D399"/>
    <text x="646" y="69" font-size="22" fill="#34D399">offline</text>

    <g stroke="#38BDF8" stroke-width="2.4" fill="none" stroke-opacity="0.75">
      <path d="M290,260 C350,260 350,170 412,170" marker-end="url(#arrow)"/>
      <path d="M290,260 C350,260 350,230 412,230" marker-end="url(#arrow)"/>
      <path d="M290,260 C350,260 350,290 412,290" marker-end="url(#arrow)"/>
      <path d="M290,260 C350,260 350,350 412,350" marker-end="url(#arrow)"/>
    </g>

    <rect x="40" y="212" width="250" height="96" rx="14" fill="#0F2A3A" stroke="#38BDF8" stroke-width="2"/>
    <text x="165" y="255" font-size="27" fill="#F8FAFC" text-anchor="middle">orchestrator</text>
    <text x="165" y="287" font-size="20" fill="#38BDF8" text-anchor="middle">A2A :8100</text>

    <g font-size="25">
      <rect x="420" y="146" width="340" height="48" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
      <text x="442" y="179" fill="#E2E8F0">coder</text><text x="740" y="178" font-size="20" fill="#64748B" text-anchor="end">:8101</text>
      <rect x="420" y="206" width="340" height="48" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
      <text x="442" y="239" fill="#E2E8F0">thinker</text><text x="740" y="238" font-size="20" fill="#64748B" text-anchor="end">:8102</text>
      <rect x="420" y="266" width="340" height="48" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
      <text x="442" y="299" fill="#E2E8F0">runner</text><text x="740" y="298" font-size="20" fill="#64748B" text-anchor="end">:8103</text>
      <rect x="420" y="326" width="340" height="48" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
      <text x="442" y="359" fill="#E2E8F0">serena</text><text x="740" y="358" font-size="20" fill="#64748B" text-anchor="end">:8104</text>
    </g>
  </g>
</svg>
