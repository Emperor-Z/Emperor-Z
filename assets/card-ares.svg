<svg xmlns="http://www.w3.org/2000/svg" width="420" height="440" viewBox="420 0 420 440" role="img" aria-label="ares: A fully local multi-agent system. An orchestrator routes over A2A HTTP to coder, thinker, runner and Serena agents on Ollama models, with on-disk mem0 memory, Langfuse tracing, and routing it learns from your ratings." font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
<defs>
  <pattern id="cp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#0C1726" stroke-width="1"/>
  </pattern>
  <pattern id="cp-scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" fill-opacity="0.22"/>
  </pattern>
  <filter id="cp-glow" filterUnits="userSpaceOnUse" x="-50" y="-50" width="1000" height="1000">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="cp-soft" filterUnits="userSpaceOnUse" x="-50" y="-50" width="1000" height="1000">
    <feGaussianBlur stdDeviation="1.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
