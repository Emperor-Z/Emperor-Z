<svg xmlns="http://www.w3.org/2000/svg" width="420" height="440" viewBox="420 0 420 440" role="img" aria-label="devdesk: Multi-agent RAG. A router delegates by explicit tool call to per-project specialist agents, each grounded in that project&#x27;s docs through Chroma, and a deterministic eval with a holdout split keeps routing honest." font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
<defs>
