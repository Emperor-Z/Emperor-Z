<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" role="img" aria-label="Arjun Ashad. Agentic AI, multi-agent systems, applied ML. MSc Applied AI at the University of Warwick. Backend engineer at FundedIn." font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
<defs>
  <pattern id="cp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#170B11" stroke-width="1"/>
