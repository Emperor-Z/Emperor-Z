<svg xmlns="http://www.w3.org/2000/svg" width="840" height="80" viewBox="0 0 840 80" role="img" aria-label="Session closed." font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
<defs>
  <pattern id="cp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#170B11" stroke-width="1"/>
  </pattern>
  <pattern id="cp-scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" fill-opacity="0.22"/>
  </pattern>
  <filter id="cp-glow" filterUnits="userSpaceOnUse" x="-50" y="-50" width="1000" height="1000">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="cp-soft" filterUnits="userSpaceOnUse" x="-50" y="-50" width="1000" height="1000">
    <feGaussianBlur stdDeviation="1.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect x="10" y="0" width="820" height="50" fill="#0A0B0E"/><rect x="10" y="0" width="820" height="50" fill="url(#cp-grid)"/><path d="M10 0V50M830 0V50" stroke="#3A0A1E" stroke-width="1.5"/>
<path d="M10 50H830" stroke="#3A0A1E" stroke-width="1.5"/>
<path d="M2 58V78H22M818 78H838V58" fill="none" stroke="#FF0055" stroke-width="2.5" filter="url(#cp-soft)"/>
<text x="40" y="32" font-size="12"><tspan fill="#00FF9C">arjun@agents</tspan><tspan fill="#6766B3">:</tspan><tspan fill="#00B0FF">~</tspan><tspan fill="#6766B3">$ </tspan><tspan fill="#A9B1D6">exit</tspan></text>
<text x="800" y="32" font-size="11" text-anchor="end" letter-spacing="2"><tspan fill="#6766B3">SESSION CLOSED · </tspan><tspan fill="#FF0055">AGENTS IDLE</tspan><tspan fill="#FF0055">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/></tspan></text>
</svg>
